<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Harmony - App</title>
    <style>
      input {
        margin: 0px;
        height: 30px;
      }
    </style>
	<link rel="stylesheet" type="text/css" href="style.css">
  </head>
  <body>
    
    <!-- App Body -->
    <div id="app" class="app-view">

      <!-- Sidebar -->
      <div id="sidebar" class="sidebar-view">
        <header class="sidebar-header">
            <div class="logo-icon"></div>
            <h2>Harmony</h2>
        </header>
        <div id="new-group-div" style="margin-left:10px;"><button id="new-group">+ New Group</button></div>
        <form id="group-list" class="group-list"></form>
        <footer id="sidebar-footer" class="sidebar-footer">
          <img id="profile-image" class="sidebar-footer-pfp chat-profile-pic"/>
          <button id="sign-out" class="red-button">Sign out</button>
        </footer>
      </div>

      <!-- Chat View -->
      <div id="chat" class="chat-view">
        <!-- Chat Header -->
        <header class="chat-header hidden" id="chat-header">
          <h3 id="chat-header-text"></h3>
          <button id="invite-user" class="invite-button blur-overlay" title="Invite user">Invite user</button>
        </header>
        <div id="messages" class="chat-all-messages-container"></div>
        <footer id="chat-footer" class="chat-footer">
          <div id="typing-indicator" class="typing-indicator hidden blur-overlay"> typing...</div>
          <div id="input" class="chat-input-container">
            <button id="attach" class="attach-button blur-overlay">+</button>
            <input id="type" placeholder="Message" class="type-box blur-overlay" type="text"></input>
            <button id="send" class="send-button">Send</button>
          </div>
        </footer>
      </div>
    </div>
  </body>
	
  <script type="module" src="socket.js"></script>
  <script type="module" src="app.js" ></script>
  <script type="module" src="session.js" ></script>
    <script type="module" src="./dom/dom.js" ></script>
    <script type="module" src="./dom/sidebar.js" ></script>
    <script type="module" src="./dom/chat.js" ></script>
</html>
